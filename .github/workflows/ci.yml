name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventura
          POSTGRES_PASSWORD: inventura
          POSTGRES_DB: inventura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventura -d inventura_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      INVENTURA_DATABASE_URL: postgresql+psycopg://inventura:inventura@localhost:5432/inventura
      INVENTURA_TEST_DATABASE_URL: postgresql+psycopg://inventura:inventura@localhost:5432/inventura_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  docker:
    # The image builds and `docker compose up` serves the demo inventory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build app

      - name: Start app and database
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Smoke test
        run: |
          curl --fail --silent http://localhost:8000/api/health
          curl --fail --silent --output /dev/null http://localhost:8000/dashboard/1
          curl --fail --silent http://localhost:8000/api/snapshots/1/dashboard \
            | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['dokumentov'] == 12, d"

      - name: Logs
        if: always()
        run: docker compose logs app

      - name: Stop
        if: always()
        run: docker compose down --volumes
