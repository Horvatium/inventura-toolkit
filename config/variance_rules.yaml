# Recount rules.
#
# Every item whose counted quantity differs from the book quantity goes to a
# recount (a new count round), found goods included. The unit price does not
# take part in that decision; it only gives the variance its value in EUR for
# the report.
#
# After round max_rounds the counted quantity is accepted and the document is
# closed, even if a difference remains.

max_rounds: 2
