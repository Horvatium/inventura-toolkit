services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventura
      POSTGRES_PASSWORD: inventura # local development only
      POSTGRES_DB: inventura
    ports:
      - "5433:5432" # 5433 on the host, so a locally installed PostgreSQL can keep 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventura -d inventura"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
